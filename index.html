<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nine Cards Game</title>
    <script defer src="https://unpkg.com/@alpinejs/persist@3.14.8/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body data-bs-theme="dark" x-data="gameState()" x-init="checkWin()">
    <div class="container my-3">
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <button class="btn btn-danger" @click="newGame()">New Game</button>
        </div>
    </div>

    <div class="container my-3">
        <div class="text-center" x-text="`Guesses: ${guesses}`"></div>
    </div>

    <div class="container my-3">
        <div class="text-center h1" x-text="message"></div>
    </div>

    <div class="container my-3">
        <div class="d-flex gap-3 justify-content-center">
            <button class="btn btn-success flex-grow-1" @click="submitGuess()"
                :disabled="!isSelectionValid() || gameWon">Submit</button>
            <button class="btn btn-primary flex-grow-1" @click="swapCards()"
                :disabled="!isSelectionValid() || gameWon">Swap</button>

        </div>
    </div>

    <div class="container-fluid">
        <div class="row mb-1 g-2">
            <template x-for="i in 9" :key="i">
                <div class="col">
                    <div class="w-100 text-center" x-text="i"></div>
                </div>
            </template>
        </div>
        <div class="row g-2">
            <template x-for="(card, idx) in cards" :key="idx">
                <div class="col">
                    <button class="btn w-100" :class="{
                        'btn-primary': primaryIdx === idx,
                        'btn-outline-primary': secondaryIdx === idx,
                        'btn-outline-secondary': primaryIdx !== idx && secondaryIdx !== idx
                    }" @click="selectCard(idx)" x-text="alphabet[card.code]"></button>
                    <div x-show="card.isRevealed" class="my-1 w-100 text-center" x-text="card.value"></div>
                    <template x-if="!card.isRevealed">
                        <div class="my-3 w-100 position-relative">
                            <span class="position-absolute top-50 start-50 translate-middle p-2 rounded-circle" :class="{
                                    'bg-info': card.facts.mirrored.includes(true),
                                    'bg-secondary': card.facts.greaterThan.some(i => i !== null),
                                    'bg-warning': card.facts.adjacent.includes(true),
                                }"></span>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <div class="container my-3">
        <hr />
    </div>

    <template x-if="primaryIdx !== null">
        <div class="container-fluid my-3">
            <div class="row mb-1">
                <div class="col text-center">
                    Placement
                </div>
            </div>
            <div class="row mb-2 g-2">
                <template x-for="(value, idx) in cards[primaryIdx].facts.placement" :key="idx">
                    <div class="col">
                        <button class="btn w-100" disabled :class="{
                        'btn-success': value === true,
                        'btn-danger': value === false,
                        'btn-outline-secondary': value === null
                    }" x-text="idx + 1"></button>
                    </div>
                </template>
            </div>
            <div class="row mb-1">
                <div class="col text-center">
                    <span class="d-inline-block p-2 bg-warning rounded-circle"></span>
                    Adjacent
                </div>
            </div>
            <div class="row mb-2 g-2">
                <template x-for="(value, idx) in cards[primaryIdx].facts.adjacent" :key="idx">
                    <div class="col">
                        <button class="btn w-100" disabled :class="{
                        'btn-success': value === true,
                        'btn-danger': value === false,
                        'btn-outline-secondary': value === null
                    }" x-text="alphabet[idx]"></button>
                    </div>
                </template>
            </div>
            <div class="row mb-1">
                <div class="col text-center">
                    <span class="d-inline-block p-2 bg-info rounded-circle"></span>
                    Mirroring
                </div>
            </div>
            <div class="row mb-2 g-2">
                <template x-for="(value, idx) in cards[primaryIdx].facts.mirrored" :key="idx">
                    <div class="col">
                        <button class="btn w-100" disabled :class="{
                        'btn-success': value === true,
                        'btn-danger': value === false,
                        'btn-outline-secondary': value === null
                    }" x-text="alphabet[idx]"></button>
                    </div>
                </template>
            </div>
            <div class="row mb-1">
                <div class="col text-center">
                    <span class="d-inline-block p-2 bg-secondary rounded-circle"></span>
                    Comparison
                </div>
            </div>
            <div class="row mb-2">
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <span
                        x-text="cards[primaryIdx].facts.greaterThan.map((value, idx) => value === true ? alphabet[idx]: '').join(' ')"></span>
                    <span>&lt;</span>
                    <span x-text="alphabet[cards[primaryIdx].code]"></span>
                    <span>&lt;</span>
                    <span
                        x-text="cards[primaryIdx].facts.greaterThan.map((value, idx) => value === false ? alphabet[idx]: '').join(' ')"></span>
                </div>
            </div>
        </div>
    </template>

    <script>
        function initGame() {
            let values = Array.from({ length: 9 }, (_, i) => i + 1);
            let codes = Array.from({ length: 9 }, (_, i) => i);

            values = shuffle(values);
            codes = shuffle(codes);

            return values.map((value, idx) => ({
                value,
                code: codes[idx],
                isRevealed: false,
                facts: {
                    placement: new Array(9).fill(null),
                    adjacent: new Array(9).fill(null),
                    mirrored: new Array(9).fill(null),
                    greaterThan: new Array(9).fill(null),
                }
            }));
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function gameState() {
            return {
                alphabet: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'],
                cards: Alpine.$persist(initGame()),
                guesses: Alpine.$persist(0),
                primaryIdx: null,
                secondaryIdx: null,
                message: 'Welcome!',
                gameWon: false,

                newGame() {
                    if (this.gameWon || confirm('Are you sure you want to start a new game?')) {
                        this.gameWon = false;
                        this.message = 'Welcome!';
                        this.secondaryIdx = null;
                        this.primaryIdx = null;
                        this.guesses = 0;
                        this.cards = initGame();
                    }
                },

                selectCard(idx) {
                    if (this.primaryIdx === idx) {
                        this.primaryIdx = this.secondaryIdx;
                        this.secondaryIdx = null;
                    } else {
                        this.secondaryIdx = this.primaryIdx;
                        this.primaryIdx = idx;
                    }
                },

                isSelectionValid() {
                    return this.primaryIdx !== null &&
                        this.secondaryIdx !== null &&
                        !this.cards[this.primaryIdx].isRevealed &&
                        !this.cards[this.secondaryIdx].isRevealed;
                },

                swapCards() {
                    if (!this.isSelectionValid()) return;
                    const temp = this.cards[this.primaryIdx];
                    this.cards[this.primaryIdx] = this.cards[this.secondaryIdx];
                    this.cards[this.secondaryIdx] = temp;
                },

                submitGuess() {
                    if (!this.isSelectionValid()) return;
                    this.checkCards();
                    this.guesses++;
                    this.checkWin();
                },

                checkCards() {
                    const primary = this.cards[this.primaryIdx];
                    const secondary = this.cards[this.secondaryIdx];

                    const oldFacts = [
                        primary.facts.placement[this.primaryIdx],
                        secondary.facts.placement[this.secondaryIdx],
                        primary.facts.adjacent[secondary.code],
                        secondary.facts.adjacent[primary.code],
                        primary.facts.mirrored[secondary.code],
                        secondary.facts.mirrored[primary.code],
                        primary.facts.greaterThan[secondary.code],
                        secondary.facts.greaterThan[primary.code]
                    ];

                    if (oldFacts.every((fact, index) => fact !== null)) {
                        this.guesses--;
                        this.message = 'Already guessed';
                        return;
                    }

                    const newFacts = [
                        primary.value === this.primaryIdx + 1,
                        secondary.value === this.secondaryIdx + 1,
                        Math.abs(primary.value - secondary.value) === 1,
                        Math.abs(primary.value - secondary.value) === 1,
                        primary.value + secondary.value === 10,
                        primary.value + secondary.value === 10,
                        primary.value > secondary.value,
                        primary.value < secondary.value
                    ];

                    switch (true) {
                        case oldFacts[0] === null && newFacts[0]:
                        case oldFacts[1] === null && newFacts[1]:
                            newFacts[2] = newFacts[3] = null;
                        case oldFacts[2] === null && newFacts[2]:
                        case oldFacts[3] === null && newFacts[3]:
                            newFacts[4] = newFacts[5] = null;
                        case oldFacts[4] === null && newFacts[4]:
                        case oldFacts[5] === null && newFacts[5]:
                            newFacts[6] = newFacts[7] = null;
                    }

                    primary.facts.placement[this.primaryIdx] = oldFacts[0] ?? newFacts[0];
                    secondary.facts.placement[this.secondaryIdx] = oldFacts[1] ?? newFacts[1];
                    primary.facts.adjacent[secondary.code] = oldFacts[2] ?? newFacts[2];
                    secondary.facts.adjacent[primary.code] = oldFacts[3] ?? newFacts[3];
                    primary.facts.mirrored[secondary.code] = oldFacts[4] ?? newFacts[4];
                    secondary.facts.mirrored[primary.code] = oldFacts[5] ?? newFacts[5];
                    primary.facts.greaterThan[secondary.code] = oldFacts[6] ?? newFacts[6];
                    secondary.facts.greaterThan[primary.code] = oldFacts[7] ?? newFacts[7];

                    const messages = [
                        oldFacts[0] === null && newFacts[0] && `${this.alphabet[primary.code]} = ${this.primaryIdx + 1}`,
                        oldFacts[1] === null && newFacts[1] && `${this.alphabet[secondary.code]} = ${this.secondaryIdx + 1}`,
                        oldFacts[2] === null && newFacts[2] && `${this.alphabet[primary.code]} is adjacent to ${this.alphabet[secondary.code]}`,
                        oldFacts[4] === null && newFacts[4] && `${this.alphabet[primary.code]} + ${this.alphabet[secondary.code]} = 10`,
                        oldFacts[6] === null && newFacts[6] && `${this.alphabet[secondary.code]} < ${this.alphabet[primary.code]}`,
                        oldFacts[7] === null && newFacts[7] && `${this.alphabet[primary.code]} < ${this.alphabet[secondary.code]}`
                    ];

                    this.message = messages.filter(Boolean).join(' and ') || 'Nothing new';
                    primary.isRevealed = primary.facts.placement[this.primaryIdx] === true;
                    secondary.isRevealed = secondary.facts.placement[this.secondaryIdx] === true;
                },

                checkWin() {
                    if (this.cards.filter(c => c.isRevealed).length >= 8) {
                        this.cards.forEach(c => c.isRevealed = true);
                        this.message = 'You Win!';
                        this.gameWon = true;
                    }
                }
            };
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
