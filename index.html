<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nine Cards Game</title>
    <script defer src="https://unpkg.com/@alpinejs/persist@3.14.8/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body data-bs-theme="dark" x-data="gameState()" x-init="checkWin()">
    <div class="container my-3">
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <button class="btn btn-danger" @click="newGame()">New Game</button>
        </div>
    </div>

    <div class="container my-3">
        <div class="text-center" x-text="`Guesses: ${guesses}`"></div>
    </div>

    <div class="container my-3">
        <div class="text-center h1" x-text="message"></div>
    </div>

    <div class="container my-3">
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <button class="btn btn-success" @click="submitGuess()"
                :disabled="!isSelectionValid() || gameWon">Submit</button>
            <button class="btn btn-primary" @click="swapCards()"
                :disabled="!isSelectionValid() || gameWon">Swap</button>

        </div>
    </div>

    <div class="container-fluid">
        <div class="row g-2">
            <template x-for="i in 9" :key="i">
                <div class="col">
                    <div class="w-100 text-center" x-text="i"></div>
                </div>
            </template>
        </div>
        <div class="row g-2">
            <template x-for="(card, idx) in cards" :key="idx">
                <div class="col">
                    <button class="btn w-100" :class="{
                        'btn-primary': primaryIdx === idx,
                        'btn-outline-primary': secondaryIdx === idx,
                        'btn-outline-secondary': primaryIdx !== idx && secondaryIdx !== idx
                    }" @click="selectCard(idx)" x-text="alphabet[card.code]"></button>
                    <div x-show="card.isRevealed" class="w-100 text-center" x-text="card.value"></div>
                </div>
            </template>
        </div>
    </div>

    <template x-if="primaryIdx !== null">
        <div class="container my-3">
            <div class="row">
                <div class="col">Placement</div>
            </div>
            <div class="row g-2">
                <template x-if="primaryIdx !== null">
                    <template x-for="(value, idx) in cards[primaryIdx].facts.placement" :key="idx">
                        <div class="col">
                            <button class="btn w-100" disabled :class="{
                        'btn-success': value === true,
                        'btn-danger': value === false,
                        'btn-outline-secondary': value === null
                    }" x-text="idx + 1"></button>
                        </div>
                    </template>
                </template>
            </div>
            <div class="row">
                <div class="col">Adjacent</div>
            </div>
            <div class="row g-2">
                <template x-if="primaryIdx !== null">
                    <template x-for="(value, idx) in cards[primaryIdx].facts.adjacent" :key="idx">
                        <div class="col">
                            <button class="btn w-100" disabled :class="{
                        'btn-success': value === true,
                        'btn-danger': value === false,
                        'btn-outline-secondary': value === null
                    }" x-text="alphabet[idx]"></button>
                        </div>
                    </template>
                </template>
            </div>
            <div class="row">
                <div class="col">Mirroring</div>
            </div>
            <div class="row g-2">
                <template x-if="primaryIdx !== null">
                    <template x-for="(value, idx) in cards[primaryIdx].facts.mirrored" :key="idx">
                        <div class="col">
                            <button class="btn w-100" disabled :class="{
                        'btn-success': value === true,
                        'btn-danger': value === false,
                        'btn-outline-secondary': value === null
                    }" x-text="alphabet[idx]"></button>
                        </div>
                    </template>
                </template>
            </div>
            <div class="row">
                <div class="col">Comparison</div>
            </div>
            <div class="row">
                <template x-if="primaryIdx !== null">
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <span
                            x-text="cards[primaryIdx].facts.greaterThan.map((value, idx) => value === true ? alphabet[idx]: '').join(' ')"></span>
                        <span>&lt;</span>
                        <span x-text="alphabet[cards[primaryIdx].code]"></span>
                        <span>&lt;</span>
                        <span
                            x-text="cards[primaryIdx].facts.greaterThan.map((value, idx) => value === false ? alphabet[idx]: '').join(' ')"></span>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <script>
        function initGame() {
            let values = Array.from({ length: 9 }, (_, i) => i + 1);
            let codes = Array.from({ length: 9 }, (_, i) => i);

            values = shuffle(values);
            codes = shuffle(codes);

            return values.map((value, idx) => ({
                value,
                code: codes[idx],
                isRevealed: false,
                facts: {
                    placement: new Array(9).fill(null),
                    adjacent: new Array(9).fill(null),
                    mirrored: new Array(9).fill(null),
                    greaterThan: new Array(9).fill(null),
                }
            }));
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function gameState() {
            return {
                alphabet: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'],
                cards: Alpine.$persist(initGame()),
                guesses: Alpine.$persist(0),
                primaryIdx: null,
                secondaryIdx: null,
                message: 'Welcome!',
                gameWon: false,

                newGame() {
                    if (this.gameWon || confirm('Are you sure you want to start a new game?')) {
                        this.gameWon = false;
                        this.message = 'Welcome!';
                        this.secondaryIdx = null;
                        this.primaryIdx = null;
                        this.guesses = 0;
                        this.cards = initGame();
                    }
                },

                selectCard(idx) {
                    if (this.primaryIdx === idx) {
                        this.primaryIdx = this.secondaryIdx;
                        this.secondaryIdx = null;
                    } else {
                        this.secondaryIdx = this.primaryIdx;
                        this.primaryIdx = idx;
                    }
                },

                isSelectionValid() {
                    return this.primaryIdx !== null &&
                        this.secondaryIdx !== null &&
                        !this.cards[this.primaryIdx].isRevealed &&
                        !this.cards[this.secondaryIdx].isRevealed;
                },

                swapCards() {
                    if (!this.isSelectionValid()) return;
                    const temp = this.cards[this.primaryIdx];
                    this.cards[this.primaryIdx] = this.cards[this.secondaryIdx];
                    this.cards[this.secondaryIdx] = temp;
                },

                submitGuess() {
                    if (!this.isSelectionValid()) return;
                    this.checkCards();
                    this.guesses++;
                    this.checkWin();
                },

                checkCards() {
                    const primary = this.cards[this.primaryIdx];
                    const secondary = this.cards[this.secondaryIdx];

                    primary.isRevealed = primary.value === this.primaryIdx + 1;
                    secondary.isRevealed = secondary.value === this.secondaryIdx + 1;

                    const primaryNewFact = primary.isRevealed && primary.facts.placement[this.primaryIdx] === null;
                    const secondaryNewFact = secondary.isRevealed && secondary.facts.placement[this.secondaryIdx] === null;

                    primary.facts.placement[this.primaryIdx] = primary.isRevealed;
                    secondary.facts.placement[this.secondaryIdx] = secondary.isRevealed;

                    const card1 = primary.code < secondary.code ? primary : secondary;
                    const card2 = primary.code < secondary.code ? secondary : primary;

                    if (primaryNewFact && secondaryNewFact) {
                        this.message = `${this.alphabet[primary.code]} = ${this.primaryIdx + 1} and ${this.alphabet[secondary.code]} = ${this.secondaryIdx + 1}`;
                    } else if (primaryNewFact) {
                        this.message = `${this.alphabet[primary.code]} = ${this.primaryIdx + 1}`;
                    } else if (secondaryNewFact) {
                        this.message = `${this.alphabet[secondary.code]} = ${this.secondaryIdx + 1}`;
                    } else if (this.checkAdjacent(card1, card2)) {
                        return;
                    } else if (this.checkMirrored(card1, card2)) {
                        return;
                    } else if (this.checkGreater(card1, card2)) {
                        return;
                    } else {
                        this.guesses--;
                        this.message = 'Already guessed';
                    }
                },

                checkAdjacent(card1, card2) {
                    const isHit = Math.abs(card1.value - card2.value) === 1;
                    const card1NewFact = card1.facts.adjacent[card2.code] === null;
                    const card2NewFact = card2.facts.adjacent[card1.code] === null;

                    card1.facts.adjacent[card2.code] = isHit;
                    card2.facts.adjacent[card1.code] = isHit;
                    if (isHit && (card1NewFact || card2NewFact)) {
                        this.message = `${this.alphabet[card1.code]} is adjacent to ${this.alphabet[card2.code]}`;
                        return true;
                    }
                    return false;
                },

                checkMirrored(card1, card2) {
                    const isHit = card1.value + card2.value === 10;
                    const card1NewFact = card1.facts.mirrored[card2.code] === null;
                    const card2NewFact = card2.facts.mirrored[card1.code] === null;

                    card1.facts.mirrored[card2.code] = isHit;
                    card2.facts.mirrored[card1.code] = isHit;
                    if (isHit && (card1NewFact || card2NewFact)) {
                        this.message = `${this.alphabet[card1.code]} + ${this.alphabet[card2.code]} = 10`;
                        return true;
                    }
                    return false;
                },

                checkGreater(card1, card2) {
                    const isHit = card1.value > card2.value;
                    const card1NewFact = card1.facts.greaterThan[card2.code] === null;
                    const card2NewFact = card2.facts.greaterThan[card1.code] === null;

                    card1.facts.greaterThan[card2.code] = isHit;
                    card2.facts.greaterThan[card1.code] = !isHit;
                    if (card1NewFact || card2NewFact) {
                        this.message = `${this.alphabet[isHit ? card2.code : card1.code]} < ${this.alphabet[isHit ? card1.code : card2.code]}`;
                        return true;
                    }
                    return false;
                },

                checkWin() {
                    if (this.cards.filter(c => c.isRevealed).length >= 8) {
                        this.cards.forEach(c => c.isRevealed = true);
                        this.message = 'You Win!';
                        this.gameWon = true;
                    }
                }
            };
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
